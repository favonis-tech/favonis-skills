<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Promo</title>
<style>
/*@FONTS*/
  :root { --ink: #f3ead8; --muted: rgba(243,234,216,.62); --accent: #e2bd6b; color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--ink); overflow: hidden; font-family: "Noto Serif CJK SC", "Noto Serif SC", "Songti SC", serif; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage canvas { display: block; width: 100%; height: 100%; object-fit: contain; background: #000; }
  #cover { position: fixed; inset: 0; z-index: 3; cursor: pointer; background: linear-gradient(to top, rgba(0,0,0,.72), rgba(0,0,0,0) 45%); }
  #cover-caption { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 16px; padding: 0 clamp(16px, 4vw, 48px) clamp(16px, 4vw, 40px); }
  #cover-text { min-width: 0; }
  #cover-title { margin: 0; font-weight: 900; font-size: clamp(18px, 3vw, 40px); letter-spacing: .08em; line-height: 1.2; overflow-wrap: anywhere; }
  #cover-tagline { margin: 4px 0 0; font-family: "Cinzel", serif; font-size: clamp(10px, 1.2vw, 14px); letter-spacing: .25em; color: var(--muted); }
  #cover-tagline:empty { display: none; }
  #play { flex: none; width: clamp(48px, 6vw, 68px); height: clamp(48px, 6vw, 68px); border-radius: 50%; border: 1px solid rgba(226,189,107,.8);
    background: rgba(0,0,0,.4); color: var(--accent); cursor: pointer; display: grid; place-items: center; padding: 0; }
  #cover:hover #play, #play:focus-visible { background: rgba(226,189,107,.18); outline: none; }
  #play svg { width: 42%; height: 42%; margin-left: 8%; }
  #controls { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; display: flex; align-items: center; gap: 12px; padding: 18px 16px 14px;
    background: linear-gradient(transparent, rgba(0,0,0,.72)); opacity: 0; transition: opacity .3s; font: 13px/1 ui-monospace, "Noto Sans Mono", Menlo, monospace; color: #ddd; }
  #controls.show, body:not(.playing) #controls { opacity: 1; }
  body:not(.started) #controls { display: none; }
  #controls button { flex: none; width: 32px; height: 32px; padding: 0; border: 0; background: none; color: #fff; cursor: pointer; display: grid; place-items: center; }
  #controls svg { width: 20px; height: 20px; }
  .icon-pause, body.playing .icon-play { display: none; }
  body.playing .icon-pause { display: block; }
  #bar { flex: 1; height: 18px; display: flex; align-items: center; cursor: pointer; touch-action: none; }
  #track { position: relative; flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,.22); }
  #fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 2px; background: var(--accent); }
  body.export #cover, body.export #controls { display: none; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="cover">
  <div id="cover-caption">
    <button id="play" aria-label="Play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"/></svg></button>
    <div id="cover-text"><h1 id="cover-title"></h1><p id="cover-tagline"></p></div>
  </div>
</div>
<div id="controls">
  <button id="toggle" aria-label="Play or pause">
    <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"/></svg>
    <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor"><path d="M6.5 4.5h4v15h-4zm7 0h4v15h-4z"/></svg>
  </button>
  <span id="time">0:00</span>
  <div id="bar"><div id="track"><div id="fill"></div></div></div>
  <span id="duration">0:00</span>
  <button id="fullscreen" aria-label="Fullscreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>
<audio id="audio" preload="auto"></audio>
<script>window.PROMO_AUDIO = /*@AUDIO*/null;</script>
<script>/*@ENGINE*/
</script>
<script>/*@FILM*/
</script>
<script>start();</script>
</body>
</html>
